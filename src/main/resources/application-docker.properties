spring.application.name=heboard

# Database Configuration for Docker (PostgreSQL)
spring.datasource.url=${EXTERNAL_DATABASE_URL:${INTERNAL_DATABASE_URL:${DB_URL:jdbc:postgresql://postgres:5432/heboard}}}
spring.datasource.username=${DB_USER:heboard}
spring.datasource.password=${DB_PASSWORD:heboard}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json

# Frontend URL (for email verification links)
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.email.verification-token-expiration-minutes=${EMAIL_VERIFICATION_EXPIRES_MINUTES:30}

# Mail Configuration
spring.mail.host=${MAIL_HOST:mailhog}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Logging
logging.level.root=INFO
logging.level.com.example.heboard=DEBUG
