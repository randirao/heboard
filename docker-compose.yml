version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: heboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: heboard
      POSTGRES_USER: heboard
      POSTGRES_PASSWORD: heboard
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - heboard-network

  redis:
    image: redis:7-alpine
    container_name: heboard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - heboard-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heboard-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/heboard
      DB_USER: heboard
      DB_PASSWORD: heboard
    depends_on:
      - postgres
      - redis
    networks:
      - heboard-network

volumes:
  postgres-data:
  redis-data:

networks:
  heboard-network:
    driver: bridge
